<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Log</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f8;
    --surface: #ffffff;
    --ink: #1b1f24;
    --muted: #5b6470;
    --line: #d8dde3;
    --line-strong: #8a94a0;
    --accent: #0b6e62;
    --accent-hover: #095a50;
    --accent-ink: #ffffff;
    --danger: #b3261e;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --surface: #1d2125;
      --ink: #e9ecef;
      --muted: #a4adb7;
      --line: #363c43;
      --line-strong: #6f7883;
      --accent: #4cc2b1;
      --accent-hover: #6fd3c4;
      --accent-ink: #06231f;
      --danger: #ff8f86;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
  }
  [hidden] { display: none !important; }

  /* 공통 폼 요소 */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 14px; font-weight: 600; }
  .input {
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
  }
  .input:focus-visible,
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn {
    min-height: 44px;
    padding: 10px 16px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: var(--accent-hover); }
  .form-error { margin: 0; color: var(--danger); font-size: 14px; }

  /* 로그인 화면 */
  .screen-login {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 32px 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .login-card h1 { margin: 0; font-size: 24px; line-height: 1.25; letter-spacing: -0.01em; }
  .login-form { display: flex; flex-direction: column; gap: 16px; }
  .login-form .btn { width: 100%; }

  /* 주제 목록 화면 */
  .btn-secondary { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn-secondary:hover { background: var(--bg); }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .topbar .app-name { margin: 0; font-size: 18px; font-weight: 700; }
  .topbar .btn { display: inline-flex; align-items: center; text-decoration: none; }
  .page { max-width: 720px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .page-actions { display: flex; }
  .topic-form {
    display: flex; flex-direction: column; gap: 12px; padding: 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .topic-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .topic-form textarea.input { min-height: 88px; resize: vertical; }
  .form-actions { display: flex; gap: 8px; }
  .topic-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .topic-card {
    display: block; padding: 16px; color: inherit; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .topic-card:hover { border-color: var(--accent); }
  .topic-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .topic-card h2 { margin: 0 0 4px; font-size: 18px; line-height: 1.3; }
  .topic-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0; font-size: 14px; color: var(--muted); }
  .topic-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 12px; font-size: 14px; }
  .topic-stats .hours { font-size: 20px; font-weight: 700; color: var(--accent); }
  .badge-open { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--danger); color: var(--danger); font-size: 13px; font-weight: 600; }
  .empty-state { margin: 0; padding: 40px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius); }
  @media (max-width: 480px) { .topic-form .row { grid-template-columns: 1fr; } }

  /* 주제 상세 화면 */
  .topbar .back-link { color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .topbar .topbar-title { margin: 0; flex: 1; min-width: 0; font-size: 18px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-actions { display: flex; gap: 8px; }
  .summary { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; font-size: 14px; color: var(--muted); }
  .summary strong { color: var(--ink); }
  .background-text { margin: 0; white-space: pre-wrap; color: var(--muted); }
  .section { display: flex; flex-direction: column; gap: 12px; }
  .section h2 { margin: 0; font-size: 18px; }
  .quick-add { display: grid; grid-template-columns: 1fr 120px; gap: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .quick-add .field-memo, .quick-add .form-error, .quick-add .btn { grid-column: 1 / -1; }
  .record-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .record { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .record .date { font-weight: 600; }
  .record .dur { color: var(--accent); font-weight: 700; }
  .record .memo { flex: 1; min-width: 80px; color: var(--muted); font-size: 14px; }
  .record .btn { min-height: 36px; padding: 4px 12px; font-size: 14px; }
  .record-edit { display: grid; grid-template-columns: 1fr 100px; gap: 8px; width: 100%; }
  .record-edit .memo-input, .record-edit .form-actions, .record-edit .form-error { grid-column: 1 / -1; }
  .btn-more { align-self: center; }
  .filter-bar { display: flex; flex-direction: column; gap: 12px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .tabs, .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tab, .chip { min-height: 36px; padding: 4px 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: transparent; color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
  .tab[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .check { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; font-size: 14px; }
  .note-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .note-item { display: block; padding: 12px 16px; color: inherit; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .note-item:hover { border-color: var(--accent); }
  .note-item h3 { margin: 0 0 6px; font-size: 16px; }
  .note-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; color: var(--muted); }
  .badge-kind { padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line-strong); font-size: 13px; }
  .tag { padding: 2px 8px; border-radius: 6px; background: var(--bg); font-size: 13px; }

  /* 노트 편집 화면 */
  .note-form { display: flex; flex-direction: column; gap: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .note-form fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
  .note-form legend { padding: 0; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
  .radio-row { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .radio-row label { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; }
  .body-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .body-head label { font-size: 14px; font-weight: 600; }
  .body-head .btn { min-height: 36px; padding: 4px 12px; font-size: 14px; }
  .note-form textarea.input { min-height: 280px; resize: vertical; font-family: var(--mono); font-size: 14px; line-height: 1.6; }
  .preview-box { min-height: 280px; padding: 10px 12px; border: 1px dashed var(--line-strong); border-radius: var(--radius); overflow-wrap: anywhere; line-height: 1.7; }
  .counter { margin: 0; font-size: 13px; color: var(--muted); text-align: right; }

  /* 노트 보기 화면 */
  .note-view { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .note-view h2 { margin: 0; font-size: 22px; line-height: 1.3; overflow-wrap: anywhere; }
  .note-view .note-dates { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0; font-size: 13px; color: var(--muted); }
  .note-content { margin: 0; overflow-wrap: anywhere; font-size: 16px; line-height: 1.7; }
  .note-content h1, .note-content h2, .note-content h3, .preview-box h1, .preview-box h2, .preview-box h3 { margin: 16px 0 6px; line-height: 1.3; }
  .note-content h1, .preview-box h1 { font-size: 20px; }
  .note-content h2, .preview-box h2 { font-size: 18px; }
  .note-content h3, .preview-box h3 { font-size: 16px; }
  .note-content p, .preview-box p { margin: 0 0 10px; }
  .note-content ul, .note-content ol, .preview-box ul, .preview-box ol { margin: 0 0 10px; padding-left: 22px; }
  .note-content code, .preview-box code { font-family: var(--mono); font-size: 0.9em; padding: 1px 5px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
  .note-content pre, .preview-box pre { margin: 0 0 12px; padding: 12px; overflow-x: auto; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); }
  .note-content pre code, .preview-box pre code { padding: 0; border: 0; background: none; font-size: 14px; line-height: 1.6; }
  .hl-kw { color: #8250df; font-weight: 600; }
  .hl-str { color: #0a7a3d; }
  .hl-com { color: var(--muted); font-style: italic; }
  .hl-num { color: #b35900; }
  @media (prefers-color-scheme: dark) { .hl-kw { color: #c9a7ff; } .hl-str { color: #7ee2a0; } .hl-num { color: #ffb86b; } }
  .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--bg); }
  .topbar-actions .btn, .note-view .form-actions .btn { text-decoration: none; display: inline-flex; align-items: center; }
</style>
</head>
<body>
<main id="app">

  <!-- S1 -->
  <section id="s1" class="screen-login" aria-labelledby="s1-title">
    <div class="login-card">
      <h1 id="s1-title">Study Log</h1>
      <!-- F5 -->
      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="login-password">비밀번호</label>
          <input id="login-password" class="input" type="password" name="password" autocomplete="current-password" autofocus>
        </div>
        <button class="btn btn-primary" type="submit">로그인</button>
        <div id="login-errors" aria-live="polite">
          <p id="login-error-invalid" class="form-error" hidden>비밀번호가 올바르지 않습니다</p>
          <p id="login-error-locked" class="form-error" hidden>잠시 후 다시 시도하세요 (60초)</p>
        </div>
      </form>
    </div>
  </section>

  <!-- S2 -->
  <section id="s2" hidden aria-labelledby="s2-title">
    <header class="topbar">
      <h1 id="s2-title" class="app-name">Study Log</h1>
      <a id="logout-btn" class="btn btn-secondary" href="#s1">로그아웃</a>
    </header>
    <div class="page">
      <div class="page-actions">
        <button id="new-topic-btn" class="btn btn-primary" type="button" aria-expanded="false" aria-controls="topic-form">새 주제</button>
      </div>
      <form id="topic-form" class="topic-form" hidden novalidate>
        <div class="field"><!-- F1 -->
          <label for="topic-name">이름 (필수)</label>
          <input id="topic-name" class="input" type="text" name="name" maxlength="100" aria-describedby="topic-name-error">
          <p id="topic-name-error" class="form-error" role="alert" hidden></p>
        </div>
        <div class="row">
          <div class="field">
            <label for="topic-started">시작일</label>
            <input id="topic-started" class="input" type="date" name="started_on">
          </div>
          <div class="field">
            <label for="topic-target">목표일 (선택)</label>
            <input id="topic-target" class="input" type="date" name="target_date">
          </div>
        </div>
        <div class="field">
          <label for="topic-background">배경 (선택)</label>
          <textarea id="topic-background" class="input" name="background" maxlength="5000"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">만들기</button>
          <button id="topic-cancel" class="btn btn-secondary" type="button">취소</button>
        </div>
      </form>
      <ul id="topic-list" class="topic-list"></ul>
      <p id="topic-empty" class="empty-state" hidden>첫 학습 주제를 만들어 보세요</p>
    </div>
  </section>

  <!-- S3 -->
  <section id="s3" hidden aria-labelledby="s3-title">
    <header class="topbar">
      <a class="back-link" href="#s2">← 주제 목록</a>
      <h1 id="s3-title" class="topbar-title"></h1>
      <div class="topbar-actions">
        <button id="subject-edit-btn" class="btn btn-secondary" type="button">편집</button>
        <button id="export-btn" class="btn btn-secondary" type="button">내보내기</button><!-- F6 -->
      </div>
    </header>
    <div class="page">
      <form id="subject-edit-form" class="topic-form" hidden novalidate>
        <div class="field"><!-- F1 -->
          <label for="edit-name">이름</label>
          <input id="edit-name" class="input" type="text" name="name" maxlength="100" aria-describedby="edit-name-error">
          <p id="edit-name-error" class="form-error" role="alert" hidden></p>
        </div>
        <div class="row">
          <div class="field">
            <label for="edit-started">시작일</label>
            <input id="edit-started" class="input" type="date" name="started_on">
          </div>
          <div class="field">
            <label for="edit-target">목표일</label>
            <input id="edit-target" class="input" type="date" name="target_date">
          </div>
        </div>
        <div class="field">
          <label for="edit-background">배경</label>
          <textarea id="edit-background" class="input" name="background" maxlength="5000"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">저장</button>
          <button id="subject-edit-cancel" class="btn btn-secondary" type="button">취소</button>
        </div>
      </form>
      <p id="subject-summary" class="summary"></p>
      <p id="subject-background" class="background-text" hidden></p>

      <section class="section" aria-labelledby="sessions-title">
        <h2 id="sessions-title">공부 시간</h2>
        <form id="session-form" class="quick-add" novalidate><!-- F2 -->
          <div class="field">
            <label for="session-date">날짜</label>
            <input id="session-date" class="input" type="date" name="studied_on">
          </div>
          <div class="field">
            <label for="session-minutes">시간 (분)</label>
            <input id="session-minutes" class="input" type="number" name="minutes" step="15" value="60">
          </div>
          <div class="field field-memo">
            <label for="session-memo">메모 (선택)</label>
            <input id="session-memo" class="input" type="text" name="memo" maxlength="500">
          </div>
          <p id="session-error" class="form-error" role="alert" hidden></p>
          <button class="btn btn-primary" type="submit">추가</button>
        </form>
        <ul id="session-list" class="record-list"></ul>
        <button id="session-more" class="btn btn-secondary btn-more" type="button" hidden>더 보기</button>
      </section>

      <section class="section" aria-labelledby="notes-title">
        <h2 id="notes-title">노트</h2>
        <div class="page-actions">
          <a id="new-note-btn" class="btn btn-primary" href="#s4" style="text-decoration:none;display:inline-flex;align-items:center">새 노트</a>
        </div>
        <div class="filter-bar"><!-- F4 -->
          <div id="kind-tabs" class="tabs" role="group" aria-label="유형"></div>
          <label class="check"><input id="open-only" type="checkbox"> 미해결만</label>
          <div id="tag-chips" class="chips" role="group" aria-label="태그"></div>
          <input id="note-search" class="input" type="search" placeholder="제목·본문 검색" aria-label="검색어">
        </div>
        <ul id="note-list" class="note-list"></ul>
        <p id="note-empty" class="empty-state" hidden>조건에 맞는 노트가 없습니다</p>
        <button id="note-more" class="btn btn-secondary btn-more" type="button" hidden>더 보기</button>
      </section>
    </div>
  </section>

  <!-- S4 -->
  <section id="s4" hidden aria-labelledby="s4-title">
    <header class="topbar">
      <a id="note-cancel-top" class="back-link" href="#s3">← 주제</a>
      <h1 id="s4-title" class="topbar-title">노트 편집</h1>
    </header>
    <div class="page">
      <form id="note-form" class="note-form" novalidate><!-- F3 -->
        <fieldset>
          <legend>유형</legend>
          <div class="radio-row">
            <label><input type="radio" name="kind" value="remember" checked> 기억할 것</label>
            <label><input type="radio" name="kind" value="debug"> 디버깅</label>
            <label><input type="radio" name="kind" value="review"> 후기</label>
          </div>
        </fieldset>
        <div class="field">
          <label for="note-title">제목</label>
          <input id="note-title" class="input" type="text" maxlength="200" required>
        </div>
        <div class="field">
          <label for="note-tags">태그 (쉼표로 구분)</label>
          <input id="note-tags" class="input" type="text" placeholder="예: pandas, csv">
        </div>
        <label class="check"><input id="note-open" type="checkbox"> 미해결 (답을 아직 못 채운 질문)</label>
        <div class="field">
          <div class="body-head">
            <label for="note-body">본문 (마크다운)</label>
            <button id="preview-toggle" class="btn btn-secondary" type="button" aria-pressed="false">미리보기</button>
          </div>
          <textarea id="note-body" class="input" maxlength="50000"></textarea>
          <div id="note-preview" class="preview-box" hidden></div>
          <p id="body-counter" class="counter">0 / 50,000자</p>
        </div>
        <p id="note-error" class="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">저장</button>
          <a id="note-cancel" class="btn btn-secondary" href="#s3" style="text-decoration:none;display:inline-flex;align-items:center">취소</a>
        </div>
      </form>
    </div>
  </section>

  <!-- S5 -->
  <section id="s5" hidden aria-labelledby="s5-title">
    <header class="topbar">
      <a class="back-link" href="#s3">← 주제</a>
    </header>
    <div class="page">
      <article class="note-view">
        <h2 id="s5-title"></h2>
        <div id="note-view-meta" class="note-meta"></div>
        <p id="note-view-dates" class="note-dates"></p>
        <div id="note-view-body" class="note-content"></div>
        <div class="form-actions">
          <a id="note-edit-btn" class="btn btn-secondary" href="#s4">수정</a>
          <button id="note-delete-btn" class="btn btn-danger" type="button">삭제</button>
        </div>
      </article>
    </div>
  </section>

</main>
<script>
  // 더미 데이터: design.md 5절 GET /api/subjects 응답 모양. 생성 최신순.
  var TODAY = '2026-10-31';
  var subjects = [
    { id: 2, name: 'SQLD 자격증', background: '', started_on: '2026-10-30', target_date: '2026-12-06',

        while (i < lines.length && !/^```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
        var text = code.join('\n'), lang = m[1].toLowerCase();
        html += '<pre><code' + (lang ? ' class="language-' + esc(lang) + '"' : '') + '>' +
          (lang === 'python' || lang === 'py' ? highlightPython(text) : esc(text)) + '</code></pre>';
      } else if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) {
        flushPara(); flushList();
        html += '<h' + m[1].length + '>' + inlineMd(m[2]) + '</h' + m[1].length + '>';
      } else if ((m = /^\s*([-*]|\d+\.)\s+(.*)$/.exec(line))) {
        flushPara();
        var kind = /\d/.test(m[1]) ? 'ol' : 'ul';
        if (list !== kind) { flushList(); html += '<' + kind + '>'; list = kind; }
        html += '<li>' + inlineMd(m[2]) + '</li>';
      } else if (line.trim() === '') {
        flushPara(); flushList();
      } else {
        flushList(); para.push(line);
      }
      i++;
    }
    flushPara(); flushList();
    return html;
  }

  // ---- S4 노트 편집 (작성·수정 공용) ----
  var DEBUG_TEMPLATE = '## 문제상황\n\n## 원인\n\n## 해결\n';
  var TITLE_ERROR = '제목은 1~200자여야 합니다'; // 422 fields.title 문구
  var noteBody = document.getElementById('note-body');
  var notePreview = document.getElementById('note-preview');
  var previewToggle = document.getElementById('preview-toggle');
  var noteTitle = document.getElementById('note-title');
  var noteError = document.getElementById('note-error');
  var editingNoteId = null; // null이면 작성, 숫자면 그 노트를 수정
  var viewNoteId = 7;
  function updateCounter() {
    document.getElementById('body-counter').textContent = noteBody.value.length.toLocaleString('en-US') + ' / 50,000자';
  }
  function showEditor() { // 미리보기에서 편집 모드로 되돌린다
    noteBody.hidden = false; notePreview.hidden = true;
    previewToggle.setAttribute('aria-pressed', 'false'); previewToggle.textContent = '미리보기';
  }
  function openEditor(noteId) {
    editingNoteId = noteId;
    var n = noteId === null ? null : notes.filter(function (x) { return x.id === noteId; })[0];
    document.querySelectorAll('input[name="kind"]').forEach(function (r) { r.checked = r.value === (n ? n.kind : 'remember'); });
    noteTitle.value = n ? n.title : '';
    document.getElementById('note-tags').value = n ? n.tags.join(', ') : '';
    document.getElementById('note-open').checked = n ? n.is_open : false;
    noteBody.value = n ? n.body : '';
    noteError.hidden = true;
    showEditor();
    updateCounter();
    var cancelHref = n ? '#s5' : '#s3'; // 취소: 작성이면 S3, 수정이면 S5
    document.getElementById('note-cancel').href = cancelHref;
    document.getElementById('note-cancel-top').href = cancelHref;
    document.getElementById('s4-title').textContent = n ? '노트 수정' : '새 노트';
  }
  document.querySelectorAll('input[name="kind"]').forEach(function (r) {
    r.addEventListener('change', function () {
      if (r.checked && r.value === 'debug' && noteBody.value.trim() === '') {
        noteBody.value = DEBUG_TEMPLATE;
        updateCounter();
      }
    });
  });
  noteBody.addEventListener('input', updateCounter);
  previewToggle.addEventListener('click', function () {
    if (noteBody.hidden) { showEditor(); return; }
    noteBody.hidden = true;
    notePreview.hidden = false;
    previewToggle.setAttribute('aria-pressed', 'true');
    previewToggle.textContent = '편집';
    notePreview.innerHTML = noteBody.value ? renderMarkdown(noteBody.value) : '<p>(내용 없음)</p>';
  });
  document.getElementById('new-note-btn').addEventListener('click', function () { openEditor(null); });
  document.getElementById('note-edit-btn').addEventListener('click', function () { openEditor(viewNoteId); });
  document.getElementById('note-form').addEventListener('submit', function (event) { // POST / PATCH
    event.preventDefault();
    var title = noteTitle.value.trim();
    if (!title || title.length > 200) { // 서버였다면 422 fields.title
      noteError.textContent = TITLE_ERROR;
      noteError.hidden = false;
      noteTitle.focus();
      return;
    }
    noteError.hidden = true;
    var tags = [];
    document.getElementById('note-tags').value.split(',').forEach(function (t) {
      t = t.trim().toLowerCase();
      if (t && tags.indexOf(t) < 0) tags.push(t);
    });
    var kind = document.querySelector('input[name="kind"]:checked').value;
    var now = TODAY + 'T12:00:00Z';
    var isOpen = document.getElementById('note-open').checked;
    var n = editingNoteId === null ? null : notes.filter(function (x) { return x.id === editingNoteId; })[0];
    if (n) {
      n.kind = kind; n.title = title; n.body = noteBody.value; n.tags = tags; n.is_open = isOpen; n.updated_at = now;
    } else {
      n = { id: Date.now(), subject_id: currentSubjectId, kind: kind, title: title, body: noteBody.value, tags: tags,
        is_open: isOpen, created_at: now, updated_at: now };
      notes.push(n);
    }
    viewNoteId = n.id;
    refreshNotes();
    renderNoteView();
    location.hash = '#s5';
  });

  // ---- S5 노트 보기 ----
  function refreshNotes() {
    recomputeNoteCounts(currentSubject());
    saveSubjects();
    saveNotes();
    renderSubjects();
    renderNotes();
  }
  function renderNoteView() {
    var n = notes.filter(function (x) { return x.id === viewNoteId; })[0];
    var meta = document.getElementById('note-view-meta');
    var dates = document.getElementById('note-view-dates');
    var body = document.getElementById('note-view-body');
    if (!n) { // GET /api/notes/{id} → 404
      document.getElementById('s5-title').textContent = '노트를 찾을 수 없습니다';
      meta.replaceChildren(); dates.replaceChildren(); body.replaceChildren();
      return;
    }
    document.getElementById('s5-title').textContent = n.title;
    meta.replaceChildren(el('span', 'badge-kind', KIND_LABEL[n.kind]));
    n.tags.forEach(function (t) { meta.appendChild(el('span', 'tag', t)); });
    if (n.is_open) meta.appendChild(el('span', 'badge-open', '미해결'));
    dates.replaceChildren(el('span', '', '작성 ' + n.created_at.slice(0, 10)), el('span', '', '수정 ' + n.updated_at.slice(0, 10)));
    body.innerHTML = n.body ? renderMarkdown(n.body) : '<p>(내용 없음)</p>';
  }
  document.getElementById('note-delete-btn').addEventListener('click', function () { // DELETE /api/notes/{id} → 204
    if (!confirm('이 노트를 삭제할까요?')) return;
    notes = notes.filter(function (x) { return x.id !== viewNoteId; });
    refreshNotes();
    renderNoteView();
    location.hash = '#s3';
  });
  renderNoteView();

  // 화면 전환: #s1, #s2 해시로 보여 줄 화면을 고른다. 아직 없는 화면(#s3~)은 무시한다.
  // F5: 로그인하지 않았으면 S1 외 화면은 #s1로 보내고, 로그인 상태에서 S1을 열면 S2로 보낸다.
  function showScreen() {
    var id = location.hash.slice(1) || (isLoggedIn() ? 's2' : 's1');
    var target = document.getElementById(id);
    if (!target || !/^s\d+$/.test(id)) return;
    if (id !== 's1' && !isLoggedIn()) { location.hash = '#s1'; return; }
    if (id === 's1' && isLoggedIn()) { location.hash = '#s2'; return; }
    document.querySelectorAll('#app > section').forEach(function (sec) { sec.hidden = sec !== target; });
    if (id === 's1') document.getElementById('login-password').focus();
  }

  // F5 세션 흉내: 서명 쿠키 대신 발급 시각을 localStorage에 두고 30일이 지나면 거부한다.
  var SESSION_KEY = 'study-log-mockup-session';
  var SESSION_MAX_MS = 30 * 24 * 60 * 60 * 1000; // Max-Age=2592000
  var MOCK_PASSWORD = 'study1234'; // 목업 전용 비밀번호 (실제는 APP_PASSWORD)
  var failCount = 0;
  var lockedUntil = 0;
  function isLoggedIn() {
    var issued = Number(localStorage.getItem(SESSION_KEY));
    return issued > 0 && Date.now() - issued < SESSION_MAX_MS;
  }
  function showLoginError(which) {
    document.getElementById('login-error-invalid').hidden = which !== 'invalid';
    document.getElementById('login-error-locked').hidden = which !== 'locked';
  }
  window.addEventListener('hashchange', showScreen);
  renderSubjects();
  showScreen();

  document.getElementById('login-form').addEventListener('submit', function (event) { // POST /api/login
    event.preventDefault();
    var input = document.getElementById('login-password');
    if (Date.now() < lockedUntil) { showLoginError('locked'); return; } // 429 too_many_attempts
    if (input.value !== MOCK_PASSWORD) {
      failCount += 1;
      if (failCount >= 5) { lockedUntil = Date.now() + 60 * 1000; failCount = 0; showLoginError('locked'); }
      else showLoginError('invalid'); // 401 invalid_password
      input.select();
      return;
    }
    failCount = 0; // 성공하면 카운터 초기화
    showLoginError(null);
    input.value = '';
    localStorage.setItem(SESSION_KEY, String(Date.now())); // 204 + Set-Cookie
    location.hash = '#s2';
  });
  // F6: GET /api/subjects/{id}/export 흉내. 마크다운을 만들어 Blob으로 내려받게 한다.
  function buildExport(sub) {
    var out = ['# 베이스', sub.background || '', '', '# 기간', '- 시작: ' + sub.started_on,
      '- 목표: ' + (sub.target_date || '(없음)'), '', '# 공부 기록'];
    subjectSessions().slice().reverse().forEach(function (x) { // 날짜 오름차순
      var d = x.studied_on.split('-');
      out.push('- ' + Number(d[1]) + '월 ' + Number(d[2]) + '일: ' + formatHours(x.minutes));
    });
    var mine = subjectNotes().slice().sort(function (p, q) { // 생성 오름차순
      return p.created_at < q.created_at ? -1 : p.created_at > q.created_at ? 1 : p.id - q.id;
    });
    [['remember', '기억할 것'], ['debug', '디버깅'], ['review', '후기']].forEach(function (k) {
      out.push('', '# ' + k[1]);
      mine.filter(function (n) { return n.kind === k[0]; }).forEach(function (n) {
        out.push('## ' + n.title + (n.is_open ? ' (미해결)' : ''));
        if (n.tags.length) out.push('태그: ' + n.tags.join(', '), '');
        if (n.body) out.push(n.body);
        out.push('');
      });
    });
    return out.join('\n').replace(/\n{3,}/g, '\n\n').replace(/\n+$/, '') + '\n';
  }
  function exportFilename(name) { // 경로 문자(/, \, ..) 제거
    return (name.replace(/\.\./g, '').replace(/[\/\\]/g, '').trim() || 'subject') + '.md';
  }
  document.getElementById('export-btn').addEventListener('click', function () {
    var sub = currentSubject();
    var blob = new Blob([buildExport(sub)], { type: 'text/markdown;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = exportFilename(sub.name);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  document.getElementById('logout-btn').addEventListener('click', function () { // POST /api/logout → 204
    localStorage.removeItem(SESSION_KEY);
  });
</script>
</body>
</html>
