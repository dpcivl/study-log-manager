{% extends "base.html" %}
{% block title %}Study Log{% endblock %}
{% block content %}
<!-- S3 -->
<section id="s3" aria-labelledby="s3-title" data-subject-id="{{ subject_id }}">
  <header class="topbar">
    <a class="back-link" href="/">← 주제 목록</a>
    <h1 id="s3-title" class="topbar-title"></h1>
    <div class="topbar-actions">
      <button id="subject-edit-btn" class="btn btn-secondary" type="button" hidden>편집</button>
    </div>
  </header>
  <div class="page">
    <p id="subject-load-error" class="form-error" role="alert" hidden></p>
    <form id="subject-edit-form" class="topic-form" hidden novalidate>
      <div class="field"><!-- F1 -->
        <label for="edit-name">이름</label>
        <input id="edit-name" class="input" type="text" name="name" maxlength="100" aria-describedby="edit-name-error">
        <p id="edit-name-error" class="form-error" role="alert" data-error-for="name" hidden></p>
      </div>
      <div class="row">
        <div class="field">
          <label for="edit-started">시작일</label>
          <input id="edit-started" class="input" type="date" name="started_on" aria-describedby="edit-started-error">
          <p id="edit-started-error" class="form-error" role="alert" data-error-for="started_on" hidden></p>
        </div>
        <div class="field">
          <label for="edit-target">목표일</label>
          <input id="edit-target" class="input" type="date" name="target_date" aria-describedby="edit-target-error">
          <p id="edit-target-error" class="form-error" role="alert" data-error-for="target_date" hidden></p>
        </div>
      </div>
      <div class="field">
        <label for="edit-background">배경</label>
        <textarea id="edit-background" class="input" name="background" maxlength="5000" aria-describedby="edit-background-error"></textarea>
        <p id="edit-background-error" class="form-error" role="alert" data-error-for="background" hidden></p>
      </div>
      <p id="edit-form-error" class="form-error" role="alert" data-error-for="form" hidden></p>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">저장</button>
        <button id="subject-edit-cancel" class="btn btn-secondary" type="button">취소</button>
      </div>
    </form>
    <p id="subject-summary" class="summary"></p>
    <p id="subject-background" class="background-text" hidden></p>
    <section id="sessions" class="section" aria-labelledby="sessions-title" hidden>
      <h2 id="sessions-title">공부 시간</h2>
      <form id="session-form" class="quick-add" novalidate><!-- F2 -->
        <div class="field">
          <label for="session-date">날짜</label>
          <input id="session-date" class="input" type="date" name="studied_on" aria-describedby="session-date-error">
          <p id="session-date-error" class="form-error" role="alert" data-error-for="studied_on" hidden></p>
        </div>
        <div class="field">
          <label for="session-minutes">시간 (분)</label>
          <input id="session-minutes" class="input" type="number" name="minutes" step="15" value="60" aria-describedby="session-minutes-error">
          <p id="session-minutes-error" class="form-error" role="alert" data-error-for="minutes" hidden></p>
        </div>
        <div class="field field-memo">
          <label for="session-memo">메모 (선택)</label>
          <input id="session-memo" class="input" type="text" name="memo" maxlength="500" aria-describedby="session-memo-error">
          <p id="session-memo-error" class="form-error" role="alert" data-error-for="memo" hidden></p>
        </div>
        <p id="session-form-error" class="form-error" role="alert" data-error-for="form" hidden></p>
        <button class="btn btn-primary" type="submit">추가</button>
      </form>
      <p id="session-list-error" class="form-error" role="alert" hidden></p>
      <ul id="session-list" class="record-list"></ul>
      <button id="session-more" class="btn btn-secondary btn-more" type="button" hidden>더 보기</button>
    </section>
    <section id="notes" class="section" aria-labelledby="notes-title" hidden>
      <h2 id="notes-title">노트</h2>
      <div class="page-actions">
        <a id="new-note-btn" class="btn btn-primary" href="/subjects/{{ subject_id }}/notes/new">새 노트</a><!-- F3 -->
      </div>
      <div class="filter-bar"><!-- F4 -->
        <div id="kind-tabs" class="tabs" role="group" aria-label="유형"></div>
        <label class="check"><input id="open-only" type="checkbox"> 미해결만</label>
        <div id="tag-chips" class="chips" role="group" aria-label="태그"></div>
        <input id="note-search" class="input" type="search" maxlength="200" placeholder="제목·본문 검색" aria-label="검색어">
      </div>
      <p id="note-list-error" class="form-error" role="alert" hidden></p>
      <ul id="note-list" class="note-list"></ul>
      <p id="note-empty" class="empty-state" hidden>조건에 맞는 노트가 없습니다</p>
      <button id="note-more" class="btn btn-secondary btn-more" type="button" hidden>더 보기</button>
    </section>
  </div>
</section>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/subject.js"></script>{% endblock %}
